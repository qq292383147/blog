# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# 网址 Site
title: 张健龙个人技术博客
subtitle:  # 网站副标题

description: 做人以清心为根本，做事以尽心为准则   # 描述
keywords:  # 关键字
author: Acton # 您的名字
language: zh-CN # 网站使用的语言
timezone:

# 相对地址
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://qq292383147.github.io  # 网址 http://yoursite.com
root: /blog/                        # 网站根目录 /
permalink: :year/:month/:day/:title/     # 文章的 永久链接 格式
permalink_defaults:                     # 永久链接中各部分的默认值 

# 目录 Directory
source_dir: source  # 资源文件夹，这个文件夹用来存放内容。
public_dir: public  # 公共文件夹，这个文件夹用于存放生成的站点文件
tag_dir: tags       # 标签文件夹
archive_dir: archives # 归档文件夹
category_dir: categories # 分类文件夹
code_dir: downloads/code # Include code 文件夹
i18n_dir: :lang          # 国际化（i18n）文件夹
skip_render:             # 跳过指定文件的渲染，您可使用 glob 表达式来匹配路径。

# 文章 Writing
new_post_name: :title.md # 新文章的文件名称
default_layout: post     # 预设布局
titlecase: false # 把标题转换为 title case
external_link: true # 在新标签中打开链接
filename_case: 0    # 把文件名称转换为 (1) 小写或 (2) 大写
render_drafts: false  # 显示草稿
post_asset_folder: false  # 启动 Asset 文件夹
relative_link: false    # 把链接改为与根目录的相对位址
future: true      # 显示未来的文章
highlight:        # 代码块的设置
  enable: true  #true
  line_number: true #true
  auto_detect: false
  tab_replace:

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 3
  order_by: -date
  
# 分类 Category & 标签 Tag
default_category: uncategorized #默认分类
category_map:               # 分类别名
tag_map:              # 标签别名

# Header
menu:
  Home: /
  archives: /archives
  About: /about.html
  # Categories: /categories
  contact: /contact.html

# 日期 / 时间格式 Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD  # 日期格式
time_format: HH:mm:ss   # 时间格式

# 分页 Pagination
## Set per_page to 0 to disable pagination
per_page: 2       # 每页显示的文章量 (0 = 关闭分页功能)
pagination_dir: page                # 分页目录

# 扩展 Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: alpha-dust    # 当前主题名称。值为false时禁用主题

# 部署 Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: 
    # github: https://github.com/qq292383147/blog.git # 暂不使用
    gitee: https://gitee.com/zhangLong292383147/zhangLong292383147.git
  branch: blog
  force: true  # 添加强制推送选项（慎用）

